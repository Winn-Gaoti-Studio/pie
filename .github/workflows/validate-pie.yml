name: Validate Pie

on:
  pull_request:
  push:
    branches:
      - trunk-merge/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pie
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate configuration and extensions
        run: bash scripts/check.sh
