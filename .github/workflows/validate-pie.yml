name: Validate Pie

on:
  pull_request:
  push:
    branches:
      - trunk-merge/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pie
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
